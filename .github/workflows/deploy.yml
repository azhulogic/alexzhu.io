name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: dev
          path: preview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            preview/package-lock.json

      - name: Install production dependencies
        working-directory: production
        run: npm ci

      - name: Build production
        working-directory: production
        run: npm run build
        env:
          SHOW_PROJECT_DRAFTS: "false"

      - name: Install preview dependencies
        working-directory: preview
        run: npm ci

      - name: Test preview paths
        working-directory: preview
        run: npm test

      - name: Build preview
        working-directory: preview
        run: npm run build:preview

      - name: Combine production and preview
        run: |
          mkdir -p production/dist/dev
          cp -a preview/dist/. production/dist/dev/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
