<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Alex Zhu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Lato", sans-serif;
        line-height: 1.5;
        background: #fafafa;
        color: #111;
      }

      main {
        max-width: 42rem;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.25rem, 6vw, 4rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        font-size: clamp(1.25rem, 3vw, 1.75rem);
        color: #444;
      }

      #typed-word {
        color: #111;
        font-weight: 700;
      }

      .cursor {
        display: inline-block;
        margin-left: 0.08em;
        animation: blink 1s infinite;
      }

      @keyframes blink {
        0%, 50% {
          opacity: 1;
        }

        51%, 100% {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Alex Zhu</h1>
      <p>
        <span>I’m a </span><span id="typed-word"></span><span class="cursor">|</span>
      </p>
    </main>

    <script>
      const words = [
        "GNC engineer",
        "builder",
        "pilot",
        "pianist",
        "climber"
      ];

      const typedWord = document.getElementById("typed-word");

      let wordIndex = 0;
      let letterIndex = 0;
      let isDeleting = false;

      const typingSpeed = 90;
      const deletingSpeed = 45;
      const pauseAfterTyping = 1200;
      const pauseAfterDeleting = 300;

      function typeLoop() {
        const currentWord = words[wordIndex];

        if (isDeleting) {
          letterIndex--;
          typedWord.textContent = currentWord.substring(0, letterIndex);
        } else {
          letterIndex++;
          typedWord.textContent = currentWord.substring(0, letterIndex);
        }

        let delay = isDeleting ? deletingSpeed : typingSpeed;

        if (!isDeleting && letterIndex === currentWord.length) {
          delay = pauseAfterTyping;
          isDeleting = true;
        }

        if (isDeleting && letterIndex === 0) {
          isDeleting = false;
          wordIndex = (wordIndex + 1) % words.length;
          delay = pauseAfterDeleting;
        }

        setTimeout(typeLoop, delay);
      }

      typeLoop();
    </script>
  </body>
</html>
